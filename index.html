<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林间小屋 · Forest Cabin</title>
<style>
  :root{
    --ink: #f4ebdd;
    --ink-dim: rgba(244,235,221,.60);
    --panel: rgba(20,22,19,.38);
    --line: rgba(244,235,221,.15);
    --accent: #e9ba7d;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#0b0d0c; overflow:hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #scene{ display:block; width:100%; height:100%; cursor:grab; }
  #scene:active{ cursor:grabbing; }

  .hud{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  .hud > *{ pointer-events:auto; }

  .brand{
    position:absolute; left:40px; top:34px;
    text-shadow: 0 2px 20px rgba(0,0,0,.65);
  }
  .brand .zh{
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    font-size:28px; letter-spacing:.32em; font-weight:500;
    color:#f9f1e4;
  }
  .brand .en{
    margin-top:10px; font-size:10px; letter-spacing:.46em;
    color:var(--ink-dim); text-transform:uppercase;
  }
  .brand .rule{
    margin-top:14px; width:56px; height:1px;
    background: linear-gradient(90deg, var(--accent), rgba(233,186,125,0));
  }

  .meta{
    position:absolute; right:40px; top:38px; text-align:right;
    font-size:10.5px; letter-spacing:.20em; color:var(--ink-dim);
    line-height:2.0; text-shadow:0 1px 14px rgba(0,0,0,.65);
  }
  .meta b{ color:var(--ink); font-weight:500; letter-spacing:.14em; }
  .meta .dot{ display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--accent); margin-right:7px; vertical-align:middle; opacity:.85; }

  .dock{
    position:absolute; left:50%; bottom:32px; transform:translateX(-50%);
    display:flex; align-items:center; gap:4px;
    padding:5px; border-radius:999px;
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    box-shadow: 0 10px 40px rgba(0,0,0,.40);
  }
  .preset-btn{
    appearance:none; border:0; cursor:pointer;
    padding:9px 20px; border-radius:999px;
    font-size:12.5px; letter-spacing:.22em;
    color:var(--ink-dim); background:transparent;
    font-family:inherit;
    transition: all .3s cubic-bezier(.4,0,.2,1);
  }
  .preset-btn:hover{ color:var(--ink); background:rgba(244,235,221,.07); }
  .preset-btn.active{
    color:#1e1a14;
    background: linear-gradient(180deg,#f3dcb6,#dcb179);
    box-shadow: 0 3px 16px rgba(233,186,125,.34);
  }

  .hint{
    position:absolute; left:40px; bottom:36px;
    font-size:10.5px; letter-spacing:.14em; color:var(--ink-dim);
    line-height:1.9; text-shadow:0 1px 12px rgba(0,0,0,.7);
  }
  .hint span{ color:rgba(244,235,221,.92); }

  .tools{
    position:absolute; right:40px; bottom:36px;
    display:flex; gap:9px;
  }
  .tool-btn{
    appearance:none; cursor:pointer; font-family:inherit;
    padding:8px 15px; border-radius:8px;
    font-size:10.5px; letter-spacing:.16em;
    color:var(--ink-dim);
    background:var(--panel); border:1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all .25s ease;
  }
  .tool-btn:hover{ color:var(--ink); border-color: rgba(233,186,125,.45); }

  #loading{
    position:fixed; inset:0; z-index:50;
    background: radial-gradient(circle at 50% 46%, #1a1d18 0%, #090b09 76%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
    transition: opacity 1s ease;
  }
  #loading.hidden{ opacity:0; }
  #loading .ring{
    width:32px; height:32px; border-radius:50%;
    border:1.4px solid rgba(233,186,125,.20);
    border-top-color: var(--accent);
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading .txt{ font-size:11px; letter-spacing:.38em; color:var(--ink-dim); }

  body.ui-hidden .brand,
  body.ui-hidden .meta,
  body.ui-hidden .hint,
  body.ui-hidden .dock,
  body.ui-hidden .tools{ opacity:0; pointer-events:none; }

  .brand,.meta,.hint,.dock,.tools{ transition: opacity .5s ease; }

  @media (max-width: 760px){
    .brand{ left:20px; top:20px; }
    .brand .zh{ font-size:19px; letter-spacing:.24em; }
    .brand .en{ display:none; }
    .meta{ display:none; }
    .hint{ display:none; }
    .tools{ right:14px; bottom:14px; }
    .dock{ bottom:14px; }
    .preset-btn{ padding:8px 14px; font-size:11.5px; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="brand">
      <div class="zh">林间小屋</div>
      <div class="en">Forest Cabin</div>
      <div class="rule"></div>
    </div>

    <div class="meta">
      <div><span class="dot"></span><b id="scene-name">黄昏 · 木屋 · 针叶林</b></div>
      <div id="stats">实时渲染</div>
    </div>

    <div class="hint">
      <div><span>拖动</span> 环绕视角　·　<span>滚轮</span> 推拉镜头　·　<span>右键</span> 平移</div>
    </div>

    <div class="dock">
      <button class="preset-btn active" data-preset="dusk">黄昏</button>
      <button class="preset-btn" data-preset="dawn">清晨</button>
      <button class="preset-btn" data-preset="night">夜晚</button>
    </div>

    <div class="tools">
      <button class="tool-btn" id="toggle-ui">隐藏界面</button>
      <button class="tool-btn" id="screenshot">保存画面</button>
    </div>
  </div>

  <div id="loading">
    <div class="ring"></div>
    <div class="txt">正在生长一片森林</div>
  </div>

  <div id="errbox" style="position:fixed;left:0;bottom:0;z-index:99;color:#f66;font:12px monospace;white-space:pre;display:none"></div>
  <script>
    (function () {
      var box = null;
      function show(msg) {
        box = box || document.getElementById('errbox');
        if (!box) return;
        box.style.display = 'block';
        box.textContent += msg + "\n";
        document.title = 'ERR ' + msg;
      }
      window.addEventListener('error', function (e) {
        show((e.message || 'error') + ' | ' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    })();
  </script>

  <script src="lib/three.min.js?v=26"></script>
  <script src="lib/OrbitControls.js?v=26"></script>
  <script src="lib/Pass.js?v=26"></script>
  <script src="lib/CopyShader.js?v=26"></script>
  <script src="lib/LuminosityHighPassShader.js?v=26"></script>
  <script src="lib/ShaderPass.js?v=26"></script>
  <script src="lib/MaskPass.js?v=26"></script>
  <script src="lib/EffectComposer.js?v=26"></script>
  <script src="lib/RenderPass.js?v=26"></script>
  <script src="lib/UnrealBloomPass.js?v=26"></script>

  <script src="js/util.js?v=26"></script>
  <script src="js/textures.js?v=26"></script>
  <script src="js/world.js?v=26"></script>
  <script src="js/atmosphere.js?v=26"></script>
  <script src="js/main.js?v=26"></script>
</body>
</html>
